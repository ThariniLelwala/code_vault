<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Vault - Snippet Manager</title>
    <meta name="description" content="A lightweight, dynamic application to manage and search your code snippets and study notes.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Highlight.js Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h1>Code Vault</h1>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search snippets...">
            </div>

            <div class="filters">
                <div class="filter-section">
                    <h3>Language</h3>
                    <ul id="languageFilters" class="filter-list">
                        <li class="active" data-lang="">All Languages</li>
                    </ul>
                </div>
            </div>

            <button id="addSnippetBtn" class="btn-primary">+ New Snippet</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h2 id="viewTitle">All Snippets</h2>
                <div class="tag-search">
                    <input type="text" id="tagInput" placeholder="Filter by tag (e.g. dsa)">
                </div>
            </header>

            <div class="snippet-grid" id="snippetGrid">
                <!-- Snippets will be injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Add/Edit Snippet Modal -->
    <div class="modal-overlay" id="snippetModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Snippet</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="snippetForm">
                <input type="hidden" id="snippetId">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="e.g. Quick Sort Implementation">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="label-with-badge">
                            <label for="language">Language</label>
                            <span id="detectedLangBadge" class="detected-badge" style="display: none;">Detected: <strong></strong></span>
                        </div>
                        <select id="language" required>
                            <option value="auto">⚡ Auto-Detect</option>
                            <optgroup label="Popular Languages">
                                <option value="python">Python</option>
                                <option value="javascript">JavaScript</option>
                                <option value="typescript">TypeScript</option>
                                <option value="html">HTML / XML</option>
                                <option value="css">CSS / SCSS</option>
                                <option value="sql">SQL</option>
                                <option value="cpp">C++</option>
                                <option value="c">C</option>
                                <option value="csharp">C#</option>
                                <option value="java">Java</option>
                                <option value="go">Go</option>
                                <option value="rust">Rust</option>
                            </optgroup>
                            <optgroup label="Web & Formats">
                                <option value="json">JSON</option>
                                <option value="yaml">YAML</option>
                                <option value="markdown">Markdown</option>
                                <option value="graphql">GraphQL</option>
                            </optgroup>
                            <optgroup label="Backend & Scripting">
                                <option value="php">PHP</option>
                                <option value="ruby">Ruby</option>
                                <option value="bash">Bash / Shell</option>
                                <option value="powershell">PowerShell</option>
                                <option value="kotlin">Kotlin</option>
                                <option value="swift">Swift</option>
                                <option value="dart">Dart</option>
                                <option value="r">R</option>
                                <option value="lua">Lua</option>
                                <option value="dockerfile">Dockerfile</option>
                            </optgroup>
                            <optgroup label="Other">
                                <option value="plaintext">Plain Text</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tags">Tags (comma separated)</label>
                        <input type="text" id="tags" placeholder="e.g. algorithms, dsa">
                    </div>
                </div>
                <div class="form-group">
                    <label for="content">Snippet Content</label>
                    <textarea id="content" required placeholder="Paste your code or notes here..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Snippet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Highlight.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
